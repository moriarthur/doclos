# CI for the demo preview: frozen install, typecheck, lint (no --fix),
# backend tests, production builds. Mirrors the commands documented in
# README.md / QUICK_START.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (tracked tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — pattern scan includes history-adjacent files
      - name: Scan tracked files for secret-shaped values
        run: bash scripts/check-secrets.sh

  migrations:
    name: Migrations apply on a clean PostgreSQL (twice — idempotency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Start clean PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=doclos -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=doclos_ci \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U doclos && break
            sleep 1
          done

      - name: Run migrations (first pass)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://doclos:ci@localhost:5432/doclos_ci

      - name: Run migrations again (idempotency guard)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://doclos:ci@localhost:5432/doclos_ci

  backend:
    name: Backend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager (pnpm@11)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @doclos/backend exec tsc --noEmit

      # The unit suite is fully mocked — no Postgres/Redis services needed.
      - name: Tests
        run: pnpm --filter @doclos/backend test

      - name: Lint (no --fix)
        run: pnpm --filter @doclos/backend run lint

      - name: Production build
        run: pnpm --filter @doclos/backend build

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @doclos/frontend exec tsc --noEmit

      - name: Lint (no --fix)
        run: pnpm --filter @doclos/frontend run lint

      - name: Production build
        run: pnpm --filter @doclos/frontend build
        env:
          # next build needs no real backend; NEXT_PUBLIC_API_URL stays unset
          # on purpose (same-origin default is what ships).
          NODE_ENV: production
